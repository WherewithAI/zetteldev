[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "Research notebook + agent workspace scaffolded by zetteldev"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.18",
    "scikit-learn>=1.6",
    "sympy>=1.12",
    "datasets>=3.3",
    "duckdb>=1.2",
    "sqlglot>=26",
    "ipykernel>=6.28",
    "notebook>=7.4",
    "nbformat>=5.9",
    "jupyter>=1.0",
    "fastcore>=1.5",
    "fastprogress>=1.0",
    "typer>=0.9",
    "rich>=13.7",
    "tqdm>=4.66",
    "python-dotenv",
    "pyyaml",
    "marimo>=0.15",
    "anthropic>=0.49",
    "openai>=1.81",
    "questionary>=2.1",
    "markdown-it-py",
    "pymupdf>=1.25",
    "great-tables>=0.17",
    "snakemake>=9",
    "zetteldev",                 # the tooling in .zetteldev, an editable package (see [tool.uv.sources])
])
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Only the project module: the default namespace walk scans every folder (data and .venv included) on each rebuild.
include = ["{{ cookiecutter.project_slug }}*"]
namespaces = false

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "dvc[ssh]>=3.67",            # the data tier (zetteldev.md, the data section)
]
nbdev = [
    "nbdev>=2.3",
    "quarto-cli>=1.4.549",
]
notebooks = [
    "jupyterlab>=4.0.5,<5",
    "notebook>=7.4.2,<8",
    "ipykernel>=6.28.0,<6.29",
    "nbformat>=5.9.2,<5.10",
]
marimo = ["marimo>=0.15"]
cuda = []

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv.sources]
zetteldev = { path = ".zetteldev", editable = true }

# What everyone working on this repository shares; what differs per person (della_user_scratch, and any alias that
# differs) goes in ~/.config/zetteldev/config.toml. `python3 .zetteldev/config.py` prints every resolved value.
[tool.zetteldev]
della_host = "della"                          # ssh alias of the cluster's login node
della_account = "henderson"                   # the SLURM account jobs charge
della_group_scratch = "/scratch/gpfs/HENDERSON"   # the group's scratch fileset (weights cache derives from it)
solveit_host = "solveit"                      # ssh alias of the notebook instance
# compute_host = "..."                        # the Dask machine; unset means computations run in-process
# figures_url = "https://..."                 # public base URL of the figures bucket

# marimo reads [tool.marimo] from the nearest pyproject.toml; the e-ink skin becomes every notebook's default.
[tool.marimo.display]
custom_css = [".zetteldev/eink.css"]
